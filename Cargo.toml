# Linux's tests on the emulator: the kernel (build.sh) started by
# linuxboot from an SD card through the SD loader and installed in flash
# under a unit's boot ROM (tests/disc.rs).  No Rust code of its own: the
# kernel's drivers and user space are C, built by build.sh, and
# linuxboot with the kit. The emulator, the `rnse` crate, comes from
# git, pinned to a commit of https://github.com/jroark/rnse (Cargo.lock
# pins it too).
[package]
name = "rnse-linux"
version = "0.1.0"
edition = "2021"
description = "Tests of Linux for the RNS-E 192 on the rnse emulator"
license = "GPL-2.0-only"
publish = false

[dev-dependencies]
rnse = { git = "https://github.com/jroark/rnse", rev = "0735724f7963e1871b801efcbce6dfb38a72b9bb" }

[profile.release]
opt-level = 3
debug = 1
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1
